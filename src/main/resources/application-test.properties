spring.application.name=yojna-setu-test

# H2 in-memory DB in PostgreSQL compatibility mode with pre-created schema yojna_setu
spring.datasource.url=jdbc:h2:mem:yojna_setu_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS yojna_setu
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=yojna_setu

# Disable Flyway in unit tests by default (can be enabled specifically for migration tests)
spring.flyway.enabled=false
spring.sql.init.mode=never

# Mock Secrets for tests
groq.api.key=test_groq_api_key
groq.model=llama-3.1-8b-instant
twilio.account.sid=ACtest0000000000000000000000000000
twilio.auth.token=test_twilio_auth_token
twilio.whatsapp.from=whatsapp:+14155238886
security.internal.api-secret=test-secret-key-32-chars-long-12345
security.phone.hash-pepper=test-pepper-123
