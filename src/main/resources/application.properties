spring.application.name=yojna-setu
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/yojna_setu?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Data initialization configuration
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Groq API configuration
groq.api.key=YOUR_GROQ_API_KEY

# Twilio Configuration
twilio.account.sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN
twilio.whatsapp.from=whatsapp:+14155238886

# Optimization & Logging Levels
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN



