spring.application.name=yojna-setu
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# PostgreSQL & Supabase Configuration (schema: yojna_setu)
# ------------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}?sslmode=${DATABASE_SSL_MODE:prefer}&currentSchema=${DATABASE_SCHEMA:yojna_setu}}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=YojnaSetuHikariPool
spring.datasource.hikari.connection-init-sql=SET search_path TO yojna_setu, public

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=yojna_setu
spring.jpa.properties.hibernate.jdbc.batch_size=25

# ------------------------------------------------------------------------------
# Flyway Database Migrations
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.schemas=yojna_setu
spring.flyway.default-schema=yojna_setu
spring.flyway.baseline-on-migrate=true
spring.flyway.table=flyway_schema_history

# ------------------------------------------------------------------------------
# Disabling Destructive Legacy Initialization
# ------------------------------------------------------------------------------
spring.sql.init.mode=never

# ------------------------------------------------------------------------------
# External AI Gateway (Groq)
# ------------------------------------------------------------------------------
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.whisper.model=${GROQ_WHISPER_MODEL:whisper-large-v3-turbo}
groq.timeout.ms=${GROQ_TIMEOUT_MS:5000}

# ------------------------------------------------------------------------------
# WhatsApp Provider (Twilio)
# ------------------------------------------------------------------------------
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# ------------------------------------------------------------------------------
# Security & Internal API Key
# ------------------------------------------------------------------------------
security.internal.api-secret=${INTERNAL_API_SECRET:dev-internal-secret-change-in-prod}
security.phone.hash-pepper=${PHONE_HASH_PEPPER:default-yojna-setu-pepper}

# ------------------------------------------------------------------------------
# Actuator & Observability
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
